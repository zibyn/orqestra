# Copy .env.example to .env and fill it in, then: docker compose up -d
name: orqestra

# Docker keeps container logs forever by default
x-logging: &logging
  logging:
    options: { max-size: 10m, max-file: "3" }

x-app: &app
  <<: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgres://orqestra:${POSTGRES_PASSWORD:-orqestra}@postgres:5432/orqestra
    # where web's SSR reaches the api
    API_URL: http://api:3001
  restart: unless-stopped

services:
  postgres:
    <<: *logging
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orqestra}
      POSTGRES_DB: orqestra
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra -d orqestra"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Applies database migrations once, before the api, web and worker start
  migrate:
    <<: *app
    image: ghcr.io/zibyn/orqestra-migrate:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: migrate }
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # The one published port: /api/* and /auth/* go to the api, everything else to web
  caddy:
    <<: *logging
    image: caddy:2-alpine
    configs:
      - { source: caddyfile, target: /etc/caddy/Caddyfile }
    ports:
      - "${PORT:-3000}:3000"
    depends_on: [api, web]
    restart: unless-stopped

  api:
    <<: *app
    image: ghcr.io/zibyn/orqestra-api:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *app
    image: ghcr.io/zibyn/orqestra-web:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: web }
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    image: ghcr.io/zibyn/orqestra-worker:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: worker }
    # the worker gives active Runs 10s to stop; Docker's default 10s would kill it first
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres:

configs:
  caddyfile:
    # shortcut: web still serves the routes in @web until they move to the api; drop each as it does
    content: |
      :3000 {
      	@web path_regexp ^/api/(skills|conversations/[^/]+/events)$$
      	handle @web {
      		reverse_proxy web:3000
      	}
      	@api path /api/* /auth/*
      	handle @api {
      		reverse_proxy api:3001
      	}
      	handle {
      		reverse_proxy web:3000
      	}
      }
