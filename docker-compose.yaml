# Copy .env.example to .env and fill it in, then: docker compose up -d
name: orqestra

x-app: &app
  env_file: .env
  environment:
    DATABASE_URL: postgres://orqestra:${POSTGRES_PASSWORD:-orqestra}@postgres:5432/orqestra
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orqestra}
      POSTGRES_DB: orqestra
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra -d orqestra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies database migrations once, before web and worker start
  migrate:
    <<: *app
    image: ghcr.io/zibyn/orqestra-worker:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: worker }
    working_dir: /app
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    image: ghcr.io/zibyn/orqestra-web:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: web }
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    image: ghcr.io/zibyn/orqestra-worker:${ORQESTRA_VERSION:-latest}
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres:
