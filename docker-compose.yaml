# Copy .env.example to .env and fill it in, then: docker compose up -d
name: orqestra

# Docker keeps container logs forever by default
x-logging: &logging
  logging:
    options: { max-size: 10m, max-file: "3" }

x-app: &app
  <<: *logging
  env_file: .env
  environment:
    DATABASE_URL: postgres://orqestra:${POSTGRES_PASSWORD:-orqestra}@postgres:5432/orqestra
    # the bundled RustFS unless .env names another S3-compatible store
    S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
    S3_BUCKET: ${S3_BUCKET:-orqestra}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orqestra}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orqestra-secret}
  restart: unless-stopped

services:
  postgres:
    <<: *logging
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orqestra}
      POSTGRES_DB: orqestra
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra -d orqestra"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Object storage for Attachments (ADR 0007)
  rustfs:
    <<: *logging
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-orqestra}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-orqestra-secret}
    volumes:
      - rustfs:/data
    restart: unless-stopped

  # Creates the bucket once (S3's CreateBucket, signed by curl), before the api and worker start
  bucket:
    <<: *logging
    image: curlimages/curl:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user "$$KEY:$$SECRET" -X PUT "$$ENDPOINT/$$BUCKET"
        || curl -s --aws-sigv4 aws:amz:us-east-1:s3 --user "$$KEY:$$SECRET" -I "$$ENDPOINT/$$BUCKET" | grep -q "^HTTP/[0-9.]* 200";
        do sleep 2; done
    environment:
      ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      BUCKET: ${S3_BUCKET:-orqestra}
      KEY: ${S3_ACCESS_KEY_ID:-orqestra}
      SECRET: ${S3_SECRET_ACCESS_KEY:-orqestra-secret}
    restart: "no"
    depends_on: [rustfs]

  # Applies database migrations once, before the api, web and worker start
  migrate:
    <<: *app
    image: ghcr.io/zibyn/orqestra-migrate:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: migrate }
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # The one published port: /api/* and /auth/* go to the api, everything else to web
  caddy:
    <<: *logging
    image: caddy:2-alpine
    configs:
      - { source: caddyfile, target: /etc/caddy/Caddyfile }
    ports:
      - "${PORT:-3000}:3000"
    depends_on: [api, web]
    restart: unless-stopped

  api:
    <<: *app
    image: ghcr.io/zibyn/orqestra-api:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket: { condition: service_completed_successfully }

  # Only renders pages: no database or secrets, just where its SSR reaches the api
  web:
    <<: *logging
    image: ghcr.io/zibyn/orqestra-web:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: web }
    environment:
      API_URL: http://api:3001
    restart: unless-stopped
    depends_on: [api]

  worker:
    <<: *app
    image: ghcr.io/zibyn/orqestra-worker:${ORQESTRA_VERSION:-latest}
    build: { context: ., target: worker }
    # the worker gives active Runs 10s to stop; Docker's default 10s would kill it first
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      bucket: { condition: service_completed_successfully }

volumes:
  postgres:
  rustfs:

configs:
  caddyfile:
    content: |
      :3000 {
      	@api path /api/* /auth/*
      	handle @api {
      		reverse_proxy api:3001
      	}
      	handle {
      		reverse_proxy web:3000
      	}
      }
